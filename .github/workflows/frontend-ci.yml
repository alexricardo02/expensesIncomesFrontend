name: Frontend Security & Build Pipeline

# The pipeline will run on every push or pull request to the "main" branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-build:
    name: Security, License and Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Change to '20' if you are using Node 20
          cache: 'npm'

      - name: Install Dependencies (Safe Mode)
        # --ignore-scripts prevents malicious or tracking scripts from running automatically during install
        run: npm ci --ignore-scripts

      - name: Verify Package Integrity (Anti-Malware)
        # Valida firmas de procedencia publicadas en npm; detecta paquetes alterados/maliciosos
        run: npm audit signatures

      - name: Disable Next.js Telemetry (Privacy)
        # Next.js sends usage data to Vercel by default. This explicitly blocks it for privacy compliance.
        run: npx next telemetry disable

      - name: Dependency Review (License + Known Malicious Packages)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-1.0-only, GPL-2.0-only, GPL-3.0-only, AGPL-1.0-only, AGPL-3.0-only, GPL-1.0-or-later, GPL-2.0-or-later, GPL-3.0-or-later, AGPL-3.0-or-later

      - name: Privacy Scanner (Datenschutz Check)
        # Checks package.json for known third-party tracking and analytics tools
        run: |
          BANNED_PACKAGES=("react-ga" "react-ga4" "mixpanel-browser" "hotjar-react" "posthog-js" "facebook-pixel")
          for pkg in "${BANNED_PACKAGES[@]}"; do
            if grep -q "\"$pkg\"" package.json; then
              echo "🚨 PRIVACY VIOLATION: Banned tracking package detected ($pkg)"
              exit 1
            fi
          done
          echo "No known tracking packages detected."

      - name: Security Audit (Vulnerabilities)
        # Checks if any installed library has high or critical security issues
        run: npm audit --audit-level=high

      - name: Code Linter
        run: npm run lint

      - name: Build Project
        # Builds the Next.js frontend only if all previous security and privacy checks pass
        run: npm run build
  
  codeql:
    name: Static Application Security Testing (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3